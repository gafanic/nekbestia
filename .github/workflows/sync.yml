name: Sync Fork

on:
  schedule:
    # Esegue la sincronizzazione ogni giorno alle 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del tuo fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizzazione automatica con Upstream
        uses: a22333/git-repo-sync@v1
        with:
          upstream_repo: "https://github.com/realbestia1/EasyProxy.git"
          upstream_branch: "main" # Modifica in "master" se il ramo principale dell'originale si chiama master
          target_branch: "main"   # Il ramo del tuo fork da aggiornare
          github_token: ${{ secrets.GITHUB_TOKEN }}
