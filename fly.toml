# fly.toml app configuration file generated for nekbestia on 2026-09-03T14:14:34Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nekbestia'
primary_region = 'ams'

[build]

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
